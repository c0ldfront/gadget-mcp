name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# The live LLM-discovery suite (tests/live/discovery.test.ts) is NEVER run by
# GitHub Actions: it spends real model credits, is timing-sensitive, and is
# explicitly opt-in via GADGET_LIVE_TESTS=1. Run it locally with
# `bun run test:live` — see docs/live-tests.md.

jobs:
  check:
    name: lint + typecheck + test (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [latest, canary]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome check
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Offline test suite (unit + e2e + harness)
        run: bun run test
      - name: Forge build smoke (native triple only)
        # Full cross-compile is exercised by release.yml on `v*` tags.
        run: bun run forge.ts build --profile=debug --only=x64

  bench:
    name: benchmarks (regression guard)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run benchmarks vs baseline
        run: bun run bench

  coverage:
    name: test coverage (text + lcov)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run coverage
        run: bun run test:coverage
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

